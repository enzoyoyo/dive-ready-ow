name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test on iOS Simulator
        run: |
          simulator_udid="$(xcrun simctl list devices available | sed -nE '/iPhone .*\([0-9A-F-]{36}\) \((Shutdown|Booted)\)/{s/.*\(([0-9A-F-]{36})\).*/\1/p;q;}')"
          if [ -z "$simulator_udid" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          xcodebuild \
            -project DiveReadyOW.xcodeproj \
            -scheme DiveReadyOW \
            -sdk iphonesimulator \
            -destination "id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/DiveReadyOW-DerivedData" \
            test
